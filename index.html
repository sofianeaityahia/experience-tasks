<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دفترچه تجربیات | تسک‌های من</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <div class="logo-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1>دفترچه تجربیات من</h1>
          <p class="subtitle">تجربیات و یادداشت‌های روزانه در قالب تسک‌های ساده</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="exportBtn" class="icon-btn" title="دانلود نسخه پشتیبان (JSON)" aria-label="دانلود نسخه پشتیبان">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="btn-label">پشتیبان</span>
        </button>

        <button type="button" id="importBtn" class="icon-btn" title="بازیابی از فایل پشتیبان (JSON)" aria-label="بازیابی از فایل">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="btn-label">بازیابی</span>
        </button>
        <input type="file" id="importFile" accept=".json" hidden />

        <button type="button" id="themeToggle" class="icon-btn" title="تغییر تم روشن/تیره" aria-label="تغییر تم">
          <svg id="sunIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="moonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Summary -->
    <section class="stats-bar" aria-label="آمار تسک‌ها">
      <div class="stat-pill">
        <span class="stat-label">کل تجربیات:</span>
        <strong id="totalCount">۰</strong>
      </div>
      <div class="stat-pill">
        <span class="stat-label">در جریان:</span>
        <strong id="activeCount">۰</strong>
      </div>
      <div class="stat-pill stat-done">
        <span class="stat-label">تکمیل‌شده:</span>
        <strong id="doneCount">۰</strong>
      </div>
    </section>

    <!-- Add New Experience Task Form -->
    <section class="composer-card">
      <form id="taskForm" autocomplete="off">
        <div class="form-row">
          <input
            type="text"
            id="taskTitle"
            class="title-input"
            placeholder="عنوان تسک یا تجربه جدید را بنویسید..."
            required
          />
        </div>

        <div class="form-row">
          <textarea
            id="taskNote"
            class="note-input"
            rows="3"
            placeholder="شرح تجربه، نکته‌ای که یاد گرفتید یا جزئیات بیشتر... (اختیاری)"
          ></textarea>
        </div>

        <div class="composer-footer">
          <div class="category-group">
            <label for="taskCategory" class="sr-only">دسته‌بندی</label>
            <select id="taskCategory" class="category-select">
              <option value="عمومی">عمومی</option>
              <option value="کاری">کاری</option>
              <option value="یادگیری">یادگیری</option>
              <option value="شخصی">شخصی</option>
              <option value="ایده">ایده</option>
            </select>

            <input
              type="text"
              id="customTag"
              class="tag-input"
              placeholder="برچسب دلخواه (اختیاری)"
              maxlength="24"
            />
          </div>

          <button type="submit" class="primary-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            ثبت تجربه
          </button>
        </div>
      </form>
    </section>

    <!-- Filter & Search Bar -->
    <section class="controls-bar">
      <div class="filter-tabs" role="tablist" aria-label="فیلتر وضعیت">
        <button type="button" class="tab-btn active" data-filter="all" role="tab" aria-selected="true">همه</button>
        <button type="button" class="tab-btn" data-filter="active" role="tab" aria-selected="false">در جریان</button>
        <button type="button" class="tab-btn" data-filter="completed" role="tab" aria-selected="false">تکمیل‌شده</button>
      </div>

      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="جستجو در عنوان، متن یا برچسب..." />
      </div>
    </section>

    <!-- Dynamic Category Filter Chips -->
    <div id="categoryChips" class="category-chips" aria-label="فیلتر دسته‌بندی"></div>

    <!-- Task List -->
    <main>
      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">📝</div>
        <h2 id="emptyTitle">هنوز تجربه‌ای ثبت نکرده‌اید</h2>
        <p id="emptyDesc">اولین تجربه یا تسک خود را از کادر بالا بنویسید تا اینجا نمایش داده شود.</p>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal-header">
        <h2 id="editModalTitle">ویرایش تجربه</h2>
        <button type="button" id="closeModalBtn" class="icon-btn-sm" aria-label="بستن">✕</button>
      </div>
      <form id="editForm" autocomplete="off">
        <input type="hidden" id="editTaskId" />
        <div class="modal-field">
          <label for="editTitle">عنوان</label>
          <input type="text" id="editTitle" class="title-input" required />
        </div>
        <div class="modal-field">
          <label for="editNote">شرح تجربه و یادداشت</label>
          <textarea id="editNote" class="note-input" rows="5"></textarea>
        </div>
        <div class="modal-row">
          <div class="modal-field">
            <label for="editCategory">دسته‌بندی</label>
            <select id="editCategory" class="category-select">
              <option value="عمومی">عمومی</option>
              <option value="کاری">کاری</option>
              <option value="یادگیری">یادگیری</option>
              <option value="شخصی">شخصی</option>
              <option value="ایده">ایده</option>
            </select>
          </div>
          <div class="modal-field">
            <label for="editTag">برچسب دلخواه</label>
            <input type="text" id="editTag" class="tag-input" maxlength="24" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelEditBtn" class="secondary-btn">انصراف</button>
          <button type="submit" class="primary-btn">ذخیره تغییرات</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
